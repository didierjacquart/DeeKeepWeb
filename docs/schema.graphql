}

type JobDto {
  id: UUID!
  service: String!
  type: String!
  title: String
  status: JobStatus!
  progress: Float!
  done: Int!
  failed: Int!
  total: Int!
  message: String
  error: String
  attempts: Int!
  groupKey: String
  payload: Any
  result: Any
  createdAt: Float!
  updatedAt: Float!
  startedAt: Float
  finishedAt: Float
}

type JobItemEvent {
  jobId: UUID!
  type: String!
  itemKey: String!
  status: String!
  message: String
  data: Any
}

type KeyValuePairOfStringAndNullableString {
  key: String!
  value: String
}

type OrganizeAlbumFolder {
  folder: String!
  label: String!
}

type OrganizeAnalyzeStart {
  session: OrganizeSessionDto!
  job: JobDto!
}

type OrganizeChecks {
  sessionId: UUID!
  checked: [Int!]!
  unchecked: [Int!]!
}

type OrganizeEntryDto {
  index: Int!
  path: String!
  dbPath: String!
  name: String!
  folder: String!
  title: String!
  titleTagged: Boolean!
  artist: String!
  album: String!
  albumArtist: String!
  genre: String!
  date: String!
  track: String!
  format: String!
  needsExtras: Boolean!
}

type OrganizeEntryPage {
  sessionId: UUID!
  items: [OrganizeEntryDto!]!
  total: Int!
}

type OrganizeJournalEntry {
  jobId: UUID!
  index: Int!
  kind: String!
  source: String!
  destination: String!
  status: String!
  message: String
  at: Float!
}

type OrganizeLookupFile {
  index: Int!
  path: String!
  dbPath: String!
  relative: String!
  title: String!
  titleTagged: Boolean!
  artist: String!
  album: String!
  coreMissing: Boolean!
}

type OrganizeLookupStart {
  job: JobDto
  files: [OrganizeLookupFile!]!
}

type OrganizeNameTagCategory {
  name: String!
  items: [OrganizeNameTagItem!]!
}

type OrganizeNameTagItem {
  label: String!
  token: String!
}

type OrganizeNameTags {
  categories: [OrganizeNameTagCategory!]!
  presets: [String!]!
  defaultPattern: String!
}

type OrganizeOptions {
  artist: Boolean!
  album: Boolean!
  rename: Boolean!
  pattern: String!

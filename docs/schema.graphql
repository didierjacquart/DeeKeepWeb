  eventsConnected: Boolean!
}

type ServiceInfo {
  service: String!
  version: String!
  startedAt: Float!
  workingSetBytes: Long!
  managedHeapBytes: Long!
  activeJobs: Int!
  outboxPending: Int!
  links: [EventLinkStatus!]!
  tools: [ToolStatus!]!

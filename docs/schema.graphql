  files: Int!
  version: Long!
  reason: String!
}

type PresenceMatchFile {
  path: String!
  reason: String!
  bitrate: Int
  fileSize: Long
  ext: String
}

type PresenceVerdict {
  key: String!
  state: PresenceState!
  reason: String

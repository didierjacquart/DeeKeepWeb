  albumArtist: String
  genre: String
  year: String
  trackNo: String
  duration: Float
  bitrate: Int
  sampleRate: Int
  channels: Int
  codec: String
  ext: String
  fileSize: Long
  fileMtime: Float
  coverSha1: String
  source: String
  inHistory: Boolean!
  historyPos: Int
  onDisk: Boolean!
  archiveState: String!
  archiveBytes: Long
  updatedAt: Float!
  format: String
  archiveKey: String
  archiveSourceBytes: Long
  archiveBitrate: Int
  historyCoverSha1: String
  localPath: String
}

type TrackPage {
  items: [TrackDto!]!
  total: Int!
  totalOnDisk: Int!
  totalMissing: Int!
}

type TracksChangedEvent {
  paths: [String!]!
  reason: String!
}

input ConvertItemInput {
  localPath: String!
  deezerId: Long
}

input DownloadTrackInput {
  id: Long!
  title: String!
  artist: String!
  album: String
  duration: Float!
  artistId: Long
  albumId: Long
  previewUrl: String
  coverSmall: String
  coverBig: String
  link: String
  trackPosition: Int
  diskNumber: Int
}

input ExportOptionsInput {
  format: String!
  quality: String!
}

input OrganizeOptionsInput {
  artist: Boolean! = true
  album: Boolean! = true
  rename: Boolean! = false
  pattern: String! = "%titre% - %artiste%"
  divers: Boolean! = false
  diversMin: Int! = 3
  keepAlbums: Boolean! = true
  dedup: Boolean! = true
  removeEmpty: Boolean! = true
  reportUntagged: Boolean! = true
  filtersOpen: Boolean! = false
}

input OrganizeTagWriteInput {
  path: String!
  fields: [TagFieldInput!]!
  overwriteExisting: Boolean! = false
}

input PresenceQueryInput {
  key: String!
  title: String!
  artist: String!
  album: String
  ext: String
}

input QualityThresholdsInput {
  hissDb: Float!
  cracklePct: Float!
  clippingPct: Float!
  gapDensityPct: Float!
  durationExcess: Float!
  durationGap: Float!
  tailSeconds: Float!
  headSeconds: Float!
  deep: Boolean!
}

input RedownloadItemInput {
  dbPath: String!
  artist: String!
  title: String!
  album: String
  duration: Float
}

input TagFieldInput {
  field: String!
  value: String
}

input TagLookupFileInput {
  path: String!
  title: String
  artist: String
  album: String
  albumArtist: String
  genre: String
  year: String
  trackNo: String
  duration: Float
  titleTagged: Boolean
  trackTotal: String
  disc: String
}

input TagValueInput {
  field: String!
  value: String
}

input TrackQueryInput {
  search: String
  includeMissing: Boolean! = false
  historyOnly: Boolean! = false
  folder: String
  sortBy: String
  descending: Boolean! = false
  offset: Int! = 0
  limit: Int! = 500
}

input WriteTagsItemInput {
  path: String!
  tags: [TagValueInput!]!
  coverUrl: String
  overwriteExisting: Boolean! = false
}

enum EntityKind {
  ARTIST
  ALBUM
  PLAYLIST
  TRACK
}

enum JobStatus {
  QUEUED
  RUNNING
  SUCCEEDED
  FAILED
  CANCELLED
}

enum PresenceState {
  PENDING
  ABSENT
  POSSIBLE
  PRESENT
}

enum SearchKind {
  ALL
  TRACK
  ARTIST
  ALBUM
  PLAYLIST
}

"The `Any` scalar type represents any valid GraphQL value."
scalar Any @specifiedBy(url: "https://scalars.graphql.org/chillicream/any.html")

"The `Long` scalar type represents a signed 64-bit integer."
scalar Long
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/long.html")

"The `UUID` scalar type represents a Universally Unique Identifier (UUID) as defined by RFC 9562."
scalar UUID
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/uuid.html")

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost(
  "The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc."
  weight: String!
) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION
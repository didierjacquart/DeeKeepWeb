  title: String
  artist: String
  album: String
  format: String
  bitrate: Int
  duration: Float
  referenceDuration: Float
  referenceState: String!
  score: Int!
  defects: [DefectInfo!]!
  measures: Any
  cells: Any!
  tooltips: Any!
  tags: Any
